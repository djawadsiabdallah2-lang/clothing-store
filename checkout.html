</main>

<script>

const SUPABASE_URL =
    "https://asnuclplpvvozslziqjc.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_dRKgnlRt6KzMOaeZV8e6Gg_Txxa5OZV";


/*
    نستخدم نفس اسم السلة الموجود في script.js
*/

let cart =
    JSON.parse(
        localStorage.getItem("style_cart") || "[]"
    );


const money = (number) =>
    Number(number).toLocaleString("fr-FR") + " دج";


/* =====================================
   عرض الطلب
===================================== */

function renderOrder() {

    const orderItems =
        document.getElementById("orderItems");

    const orderTotal =
        document.getElementById("orderTotal");


    if (!cart.length) {

        orderItems.innerHTML = `
            <div class="empty">
                🛒 السلة فارغة.
            </div>
        `;

        orderTotal.textContent = "0 دج";

        return;
    }


    let total = 0;


    orderItems.innerHTML =
        cart.map(function(item) {

            const quantity =
                Number(item.qty || 1);

            const itemTotal =
                Number(item.price) * quantity;

            total += itemTotal;


            return `
                <div class="order-item">

                    <div>

                        <h3>
                            ${item.name}
                        </h3>

                        <div class="order-details">

                            المقاس:
                            ${item.size}

                            |

                            الكمية:
                            ${quantity}

                        </div>

                    </div>

                    <div class="order-price">
                        ${money(itemTotal)}
                    </div>

                </div>
            `;

        }).join("");


    orderTotal.textContent =
        money(total);
}


/* =====================================
   إرسال الطلب إلى Supabase
===================================== */

async function confirmOrder() {

    const name =
        document
        .getElementById("customerName")
        .value
        .trim();


    const phone =
        document
        .getElementById("phone")
        .value
        .trim();


    const wilaya =
        document
        .getElementById("wilaya")
        .value
        .trim();


    const address =
        document
        .getElementById("address")
        .value
        .trim();


    /* التحقق */

    if (!cart.length) {

        alert(
            "🛒 السلة فارغة! أضف منتجًا أولاً."
        );

        return;
    }


    if (
        !name ||
        !phone ||
        !wilaya ||
        !address
    ) {

        alert(
            "⚠️ يرجى ملء جميع معلومات الطلب."
        );

        return;
    }


    /* حساب المجموع */

    let total = 0;

    cart.forEach(function(item) {

        total +=
            Number(item.price) *
            Number(item.qty || 1);

    });


    const button =
        document.getElementById(
            "confirmOrderButton"
        );


    button.disabled = true;

    button.textContent =
        "⏳ جاري إرسال الطلب...";


    try {

        const response =
            await fetch(
                SUPABASE_URL +
                "/rest/v1/orders",
                {

                    method: "POST",

                    headers: {

                        "Content-Type":
                            "application/json",

                        "apikey":
                            SUPABASE_KEY,

                        "Authorization":
                            "Bearer " +
                            SUPABASE_KEY,

                        "Prefer":
                            "return=minimal"

                    },

                    body: JSON.stringify({

                        customer_name: name,

                        phone: phone,

                        address: address,

                        wilaya: wilaya,

                        items: cart,

                        total: total,

                        status: "جديد"

                    })

                }
            );


        if (!response.ok) {

            const errorText =
                await response.text();

            console.error(
                "Supabase Error:",
                errorText
            );

            throw new Error(
                "فشل إرسال الطلب"
            );
        }


        /* نجاح */

        localStorage.removeItem(
            "style_cart"
        );


        alert(
            "✅ تم إرسال طلبك بنجاح!\n\n" +
            "شكرًا لك " +
            name +
            " ❤️"
        );


        window.location.href =
            "index.html";


    } catch (error) {

        console.error(error);


        alert(
            "❌ حدث خطأ أثناء إرسال الطلب.\n\n" +
            "تأكد من اتصال الإنترنت ثم حاول مرة أخرى."
        );


        button.disabled = false;

        button.textContent =
            "✅ تأكيد وإرسال الطلب";
    }

}


/* =====================================
   تشغيل الصفحة
===================================== */

document
    .getElementById(
        "confirmOrderButton"
    )
    .addEventListener(
        "click",
        confirmOrder
    );


renderOrder();

</script>

</body>
