<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>STYLE — إتمام الطلب</title><link rel="stylesheet" href="style.css"></head><body><header><div class="nav wrap"><a class="logo" href="index.html">STYLE<span>.</span></a><a href="index.html">← العودة للمتجر</a></div></header><main class="section"><div class="wrap" style="max-width:760px"><div class="product" style="padding:28px"><small>CHECKOUT</small><h1>إتمام الطلب</h1><form id="form"><div style="display:grid;gap:14px"><input required id="name" placeholder="الاسم الكامل"><input required id="phone" placeholder="رقم الهاتف"><select required id="wilaya"><option value="">اختر الولاية</option><option>الجزائر</option><option>البليدة</option><option>الوادي</option><option>قسنطينة</option><option>وهران</option><option>سطيف</option><option>عنابة</option><option>بسكرة</option></select><textarea required id="address" rows="4" placeholder="العنوان"></textarea></div><div id="summary" style="margin:25px 0"></div><button class="btn" style="width:100%">تأكيد الطلب</button></form><div id="ok" style="display:none;text-align:center;padding:35px"><h2 style="color:var(--lime)">✓ تم استلام طلبك</h2><p style="color:var(--muted)">شكرًا لاختيار STYLE.</p><a class="btn" href="index.html">العودة للمتجر</a></div></div></div></main><script>const c=JSON.parse(localStorage.getItem('style_checkout_cart')||'[]'),sum=document.getElementById('summary');let total=0;sum.innerHTML=c.length?c.map(x=>{total+=x.price*x.qty;return `<p>${x.name} — ${x.size} × ${x.qty} <b style="float:left">${(x.price*x.qty).toLocaleString('fr-FR')} دج</b></p>`}).join(''):'السلة فارغة';document.getElementById('form').onsubmit=e=>{e.preventDefault();if(!c.length)return;const orders=JSON.parse(localStorage.getItem('style_orders')||'[]');orders.push({id:'ST-'+Date.now(),name:name.value,phone:phone.value,wilaya:wilaya.value,address:address.value,items:c,total,date:new Date().toLocaleString('ar-DZ')});localStorage.setItem('style_orders',JSON.stringify(orders));localStorage.removeItem('style_cart');localStorage.removeItem('style_checkout_cart');document.getElementById('form').style.display='none';document.getElementById('ok').style.display='block'}</script></body></html>
