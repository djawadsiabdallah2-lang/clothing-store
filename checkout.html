<title>STYLE | إتمام الطلب</title>

<style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #101820;
        color: white;
    }

    .checkout-page {
        max-width: 900px;
        margin: 60px auto;
        padding: 20px;
    }

    .checkout-title {
        text-align: center;
        margin-bottom: 35px;
    }

    .checkout-title p {
        color: #00a8ff;

    .checkout-title h1 {
        font-size: 35px;
    }

    .checkout-box {
        background: #182631;
        border-radius: 18px;
        padding: 30px;
        margin-bottom: 25px;
    }

    .checkout-box h2 {
        margin-top: 0;
        margin-bottom: 25px;
    }

    .form-group {
        margin-bottom: 18px;
    }

    .form-group label {
        display: block;
        margin-bottom: 8px;
        font-weight: bold;
    }

    .form-group input,
    .form-group textarea {
        width: 100%;
        box-sizing: border-box;
        padding: 14px;
        border: 1px solid #334955;
        border-radius: 10px;
        background: #101820;
        color: white;
        font-size: 16px;
        outline: none;
    }

    .form-group input:focus,
    .form-group textarea:focus {
        border-color: #00a8ff;
    }

    .form-group textarea {
        min-height: 110px;
        resize: vertical;
    }

    .order-item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 15px;
        padding: 15px 0;
        border-bottom: 1px solid #334955;
    }

    .order-item-name {
        font-weight: bold;
    }

    .order-item-details {
        color: #aebbc4;
        font-size: 14px;
        margin-top: 5px;
    }

    .order-item-price {
        color: #00a8ff;
        font-weight: bold;

    .total-box {
        display: flex;
        justify-content: space-between;
        margin-top: 20px;
        padding-top: 20px;
        border-top: 2px solid #334955;

    .total-price {
        color: #00a8ff;
        font-size: 25px;
        font-weight: bold;
    }

    .confirm-button {

        padding: 16px;
        border: none;
        border-radius: 12px;

        font-weight: bold;
        cursor: pointer;
    }

    .confirm-button:hover {
        background: #008ed6;
    }

    .confirm-button:disabled {
        opacity: 0.6;
        cursor: not-allowed;
    }

    .back-button {
        display: block;
        width: fit-content;
        margin: 25px auto;
        color: #00a8ff;
        text-decoration: none;
    }

    .empty-order {
        text-align: center;
        color: #aebbc4;
        padding: 20px;
    }

    .success-message,
    .error-message {
        display: none;
        padding: 18px;
        border-radius: 12px;
        text-align: center;
        margin-bottom: 20px;
    }

    .success-message {
        background: #123d2a;

    }

    .error-message {
        background: #451b1b;
        border: 1px solid #d64545;

</main>

<script>

const SUPABASE_URL =
    "https://asnuclplpvvozslziqjc.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_dRKgnlRt6KzMOaeZV8e6Gg_Txxa5OZV";


// ========================================
// قراءة السلة الصحيحة
// ========================================

let cart =
    JSON.parse(
        localStorage.getItem("style_checkout_cart") || "[]"
    );


// ========================================
// عرض الطلب
// ========================================

function displayOrder() {

    const orderItems =
        document.getElementById("orderItems");

    const orderTotal =
        document.getElementById("orderTotal");


    if (!cart.length) {

        orderItems.innerHTML = `
            <div class="empty-order">
                🛒 لا توجد منتجات في الطلب.
            </div>
        `;

        orderTotal.textContent = "0 دج";

        return;
    }


    let total = 0;

    orderItems.innerHTML = "";


    cart.forEach(function(item) {

        const quantity =
            Number(item.qty) || 1;

        const price =
            Number(item.price) || 0;

        const itemTotal =
            price * quantity;

        total += itemTotal;


        const div =
            document.createElement("div");

        div.className = "order-item";


        div.innerHTML = `

            <div>

                <div class="order-item-name">
                    ${item.name}
                </div>

                <div class="order-item-details">

                    المقاس:
                    ${item.size}

                    |

                    الكمية:
                    ${quantity}

                </div>

            </div>

            <div class="order-item-price">

                ${itemTotal.toLocaleString("fr-FR")} دج

            </div>

        `;


        orderItems.appendChild(div);

    });


    orderTotal.textContent =
        total.toLocaleString("fr-FR") + " دج";
}


// ========================================
// تأكيد الطلب
// ========================================

async function confirmOrder() {

    const name =
        document
            .getElementById("customerName")
            .value
            .trim();


    const phone =
        document
            .getElementById("phone")
            .value
            .trim();


    const address =
        document
            .getElementById("address")
            .value
            .trim();


    const wilaya =
        document
            .getElementById("wilaya")
            .value
            .trim();


    const button =
        document.getElementById("confirmButton");


    const success =
        document.getElementById("successMessage");


    const error =
        document.getElementById("errorMessage");


    success.style.display = "none";
    error.style.display = "none";


    if (!cart.length) {

        alert(
            "🛒 لا توجد منتجات في الطلب."
        );

        return;
    }


    if (
        !name ||
        !phone ||
        !address ||
        !wilaya
    ) {

        alert(
            "⚠️ يرجى ملء جميع معلومات الطلب."
        );

        return;
    }


    let total = 0;


    cart.forEach(function(item) {

        total +=
            Number(item.price) *
            Number(item.qty || 1);

    });


    const orderData = {

        customer_name: name,

        phone: phone,

        address: address,

        wilaya: wilaya,

        items: cart,

        total: total,

        status: "new"

    };


    button.disabled = true;

    button.textContent =
        "⏳ جاري إرسال الطلب...";


    try {

        const response =
            await fetch(
                SUPABASE_URL + "/rest/v1/orders",
                {
                    method: "POST",

                    headers: {

                        "Content-Type":
                            "application/json",

                        "apikey":
                            SUPABASE_KEY,

                        "Authorization":
                            "Bearer " + SUPABASE_KEY,

                        "Prefer":
                            "return=minimal"
                    },

                    body:
                        JSON.stringify(orderData)
                }
            );


        if (!response.ok) {

            const message =
                await response.text();

            console.error(
                "Supabase:",
                message
            );

            throw new Error(message);
        }


        // ========================================
        // نجاح الطلب
        // ========================================

        localStorage.removeItem(
            "style_cart"
        );

        localStorage.removeItem(
            "style_checkout_cart"
        );


        cart = [];


        displayOrder();


        success.style.display =
            "block";


        button.textContent =
            "✅ تم إرسال الطلب بنجاح";


        document
            .getElementById("checkoutForm")
            .reset();


        window.scrollTo({
            top: 0,
            behavior: "smooth"
        });


    } catch (error) {

        console.error(error);


        error.style.display =
            "block";


        button.disabled = false;


        button.textContent =
            "✅ تأكيد الطلب";
    }

}


// ========================================
// تشغيل الصفحة
// ========================================

displayOrder();

</script>

</body>
</html>
