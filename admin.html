<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>تسجيل دخول الإدارة - STYLE</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Arial, sans-serif;

            background: #101820;
            color: white;
        }

        .login-box {
            width: 90%;
            max-width: 420px;

            background: #182631;

            padding: 35px;

            border-radius: 18px;

            box-shadow: 0 0 30px rgba(0, 168, 255, 0.15);

            text-align: center;
        }

        h1 {
            color: #00a8ff;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #aaa;
            margin-bottom: 30px;
        }

        input {
            width: 100%;

            padding: 14px;

            margin-bottom: 15px;

            border: 2px solid #263b49;

            border-radius: 10px;

            background: #101820;

            color: white;

            font-size: 16px;

            outline: none;
        }

        input:focus {
            border-color: #00a8ff;
        }

        button {
            width: 100%;

            padding: 14px;

            border: none;

            border-radius: 10px;

            background: #00a8ff;

            color: white;

            font-size: 17px;

            font-weight: bold;

            cursor: pointer;
        }

        button:hover {
            background: #008fd1;
        }

        #message {
            margin-top: 18px;
            min-height: 25px;
        }

        .back {
            display: inline-block;

            margin-top: 20px;

            color: #00a8ff;

            text-decoration: none;
        }

    </style>

</head>


<body>

    <div class="login-box">

        <h1>🔐 STYLE</h1>

        <p class="subtitle">
            لوحة الإدارة
        </p>


        <input
            type="email"
            id="email"
            placeholder="البريد الإلكتروني"
            autocomplete="email"
        >


        <input
            type="password"
            id="password"
            placeholder="كلمة المرور"
            autocomplete="current-password"
        >


        <button id="loginButton">
            تسجيل الدخول
        </button>


        <div id="message"></div>


        <a
            href="index.html"
            class="back"
        >
            ← العودة إلى المتجر
        </a>

    </div>


    <script>

        // ========================================
        // إعداد Supabase
        // ========================================

        const SUPABASE_URL =
            "https://vxodqzejcqdrztsmuhhf.supabase.co";


        const SUPABASE_PUBLISHABLE_KEY =
            "sb_publishable_MxVSNULC7StDsWOXn9yG7A_5TJimk5J";


        const supabaseClient =
            supabase.createClient(
                SUPABASE_URL,
                SUPABASE_PUBLISHABLE_KEY
            );


        // ========================================
        // العناصر
        // ========================================

        const emailInput =
            document.getElementById("email");


        const passwordInput =
            document.getElementById("password");


        const loginButton =
            document.getElementById("loginButton");


        const message =
            document.getElementById("message");


        // ========================================
        // تسجيل الدخول
        // ========================================

        async function login() {

            const email =
                emailInput.value.trim();


            const password =
                passwordInput.value;


            if (!email || !password) {

                message.textContent =
                    "⚠️ أدخل البريد الإلكتروني وكلمة المرور.";

                message.style.color =
                    "#ffcc00";

                return;
            }


            loginButton.disabled = true;

            loginButton.textContent =
                "جاري تسجيل الدخول...";


            message.textContent = "";


            const { data, error } =
                await supabaseClient.auth.signInWithPassword({

                    email: email,

                    password: password

                });


            if (error) {

                console.error(error);


                message.textContent =
                    "❌ البريد الإلكتروني أو كلمة المرور غير صحيحة.";

                message.style.color =
                    "#ff5555";


                loginButton.disabled = false;

                loginButton.textContent =
                    "تسجيل الدخول";

                return;
            }


            if (data.session) {

                message.textContent =
                    "✅ تم تسجيل الدخول بنجاح!";


                message.style.color =
                    "#00ff88";


                setTimeout(function () {

                    window.location.href =
                        "admin-dashboard.html";

                }, 700);

            }

        }


        // ========================================
        // زر الدخول
        // ========================================

        loginButton.addEventListener(
            "click",
            login
        );


        // السماح بالضغط على Enter
        document.addEventListener(
            "keydown",
            function (event) {

                if (event.key === "Enter") {

                    login();

                }

            }
        );


        // ========================================
        // إذا كان المدير مسجلًا بالفعل
        // ========================================

        async function checkSession() {

            const { data } =
                await supabaseClient.auth.getSession();


            if (data.session) {

                window.location.href =
                    "admin-dashboard.html";

            }

        }


        checkSession();

    </script>

</body>

</html>
