<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>تسجيل دخول الإدارة - STYLE</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Arial, sans-serif;

            background: #101820;
            color: white;
        }

        .login-box {
            width: 90%;
            max-width: 420px;

            background: #182631;

            padding: 35px;

            border-radius: 18px;

            box-shadow: 0 0 30px rgba(0, 168, 255, 0.15);

            text-align: center;
        }

        h1 {
            color: #00a8ff;
        }

        .subtitle {
            color: #aaa;
            margin-bottom: 30px;
        }

        input {
            width: 100%;

            padding: 14px;

            margin-bottom: 15px;

            border: 2px solid #263b49;

            border-radius: 10px;

            background: #101820;

            color: white;

            font-size: 16px;

            outline: none;
        }

        input:focus {
            border-color: #00a8ff;
        }

        button {
            width: 100%;

            padding: 14px;

            border: none;

            border-radius: 10px;

            background: #00a8ff;

            color: white;

            font-size: 17px;

            font-weight: bold;

            cursor: pointer;
        }

        button:disabled {
            opacity: 0.6;
            cursor: wait;
        }

        #message {
            margin-top: 20px;
            line-height: 1.6;
        }

        .back {
            display: inline-block;

            margin-top: 20px;

            color: #00a8ff;

            text-decoration: none;
        }

    </style>

</head>


<body>

    <div class="login-box">

        <h1>🔐 STYLE</h1>

        <p class="subtitle">
            لوحة الإدارة
        </p>


        <input
            type="email"
            id="email"
            placeholder="البريد الإلكتروني"
        >


        <input
            type="password"
            id="password"
            placeholder="كلمة المرور"
        >


        <button id="loginButton">
            تسجيل الدخول
        </button>


        <div id="message"></div>


        <a href="index.html" class="back">
            ← العودة إلى المتجر
        </a>

    </div>


    <script>

        // ========================================
        // بيانات Supabase
        // ========================================

        const SUPABASE_URL =
            "https://vxodqzejcqdrztsmuhhf.supabase.co";


        const SUPABASE_PUBLISHABLE_KEY =
            "sb_publishable_MxVSNULC7StDsWOXn9yG7A_5TJimk5J";


        // إنشاء اتصال Supabase

        const supabaseClient =
            window.supabase.createClient(
                SUPABASE_URL,
                SUPABASE_PUBLISHABLE_KEY
            );


        // ========================================
        // العناصر
        // ========================================

        const email =
            document.getElementById("email");

        const password =
            document.getElementById("password");

        const loginButton =
            document.getElementById("loginButton");

        const message =
            document.getElementById("message");


        // ========================================
        // تسجيل الدخول
        // ========================================

        loginButton.addEventListener(
            "click",
            async function () {

                const emailValue =
                    email.value.trim();

                const passwordValue =
                    password.value;


                if (
                    emailValue === "" ||
                    passwordValue === ""
                ) {

                    message.textContent =
                        "⚠️ اكتب البريد الإلكتروني وكلمة المرور.";

                    message.style.color =
                        "#ffcc00";

                    return;
                }


                loginButton.disabled = true;

                loginButton.textContent =
                    "جاري تسجيل الدخول...";


                message.textContent =
                    "جارٍ الاتصال بـ Supabase...";

                message.style.color =
                    "#00a8ff";


                try {

                    const result =
                        await supabaseClient.auth.signInWithPassword({

                            email: emailValue,

                            password: passwordValue

                        });


                    console.log(
                        "Supabase result:",
                        result
                    );


                    if (result.error) {

                        message.innerHTML =
                            "❌ خطأ من Supabase:<br><strong>" +
                            result.error.message +
                            "</strong>";

                        message.style.color =
                            "#ff5555";


                        loginButton.disabled = false;

                        loginButton.textContent =
                            "تسجيل الدخول";

                        return;
                    }


                    if (result.data.session) {

                        message.textContent =
                            "✅ تم تسجيل الدخول! جاري فتح لوحة الإدارة...";

                        message.style.color =
                            "#00ff88";


                        setTimeout(function () {

                            window.location.href =
                                "admin-dashboard.html";

                        }, 1000);

                    }

                }

                catch (error) {

                    console.error(error);


                    message.innerHTML =
                        "❌ حدث خطأ:<br><strong>" +
                        error.message +
                        "</strong>";

                    message.style.color =
                        "#ff5555";


                    loginButton.disabled = false;

                    loginButton.textContent =
                        "تسجيل الدخول";

                }

            }
        );

    </script>

</body>

</html>
