<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>STYLE — الإدارة</title><link rel="stylesheet" href="style.css"></head><body><main class="section"><div class="wrap" style="max-width:460px"><div class="product" style="padding:28px"><small>STYLE ADMIN</small><h1>دخول الإدارة</h1><p style="color:var(--muted)">لوحة خاصة بإدارة الطلبات.</p><input id="pass" type="password" placeholder="كلمة مرور الإدارة" style="width:100%;padding:13px;background:#0b0e13;border:1px solid var(--line);color:#fff;border-radius:10px"><button class="btn" style="width:100%;margin-top:12px" onclick="go()">دخول</button><p id="msg" style="color:#ff6574"></p></div></div></main><script>function go(){if(pass.value==='STYLE2026'){sessionStorage.setItem('style_admin','1');location.href='admin-dashboard.html'}else msg.textContent='كلمة المرور غير صحيحة'}</script></body></html>
