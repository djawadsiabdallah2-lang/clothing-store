<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>STYLE — لوحة الإدارة</title><link rel="stylesheet" href="style.css"></head><body><header><div class="nav wrap"><a class="logo" href="index.html">STYLE<span>.</span></a><button class="btn" onclick="logout()">تسجيل الخروج</button></div></header><main class="section"><div class="wrap"><small>ADMIN DASHBOARD</small><h1>لوحة التحكم</h1><div class="stats"><div><strong id="n">0</strong><span>طلب</span></div><div><strong id="s">0 دج</strong><span>المبيعات</span></div></div><div style="margin-top:30px" class="product"><div class="info"><h2>الطلبات</h2><div id="orders"></div></div></div></div></main><script>if(sessionStorage.getItem('style_admin')!=='1')location.href='admin.html';const o=JSON.parse(localStorage.getItem('style_orders')||'[]');n.textContent=o.length;s.textContent=o.reduce((a,x)=>a+Number(x.total||0),0).toLocaleString('fr-FR')+' دج';orders.innerHTML=o.length?o.slice().reverse().map(x=>`<div class="cartItem"><b>${x.name}</b><p>📞 ${x.phone} — 📍 ${x.wilaya}</p><p>${x.address}</p><p>💰 ${Number(x.total).toLocaleString('fr-FR')} دج</p><p>${x.date}</p></div>`).join(''):'<p style="color:var(--muted)">لا توجد طلبات.</p>';function logout(){sessionStorage.clear();location.href='admin.html'}</script></body></html>
